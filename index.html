<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Team Ornontowice — nowy adres</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- Zapas, gdy JavaScript jest wyłączony. JS niżej jest lepszy, bo przenosi też
     fragment adresu (#access_token z linku resetu hasła), którego meta refresh gubi. -->
<meta http-equiv="refresh" content="3;url=https://szkoly-team.takt-system.pl/teamornontowice-zapisy/">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#1a1a1a; color:#f4f4f5; font-family:-apple-system,system-ui,sans-serif;
         text-align:center; padding:24px; }
  .box { max-width:34rem; }
  h1 { font-size:1.35rem; font-weight:650; margin:0 0 14px; }
  p { line-height:1.6; color:#c9c4bd; margin:0 0 18px; }
  a.btn { display:inline-block; background:#c9a84c; color:#1a1a1a; text-decoration:none;
          font-weight:700; padding:11px 22px; border-radius:8px; }
  a.btn:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  code { color:#c9a84c; font-size:.9em; word-break:break-all; }
</style>
</head>
<body>
  <div class="box">
    <h1>Zapisy na lekcje przeniosły się</h1>
    <p>Przenosimy Cię na nowy adres:<br><code>https://szkoly-team.takt-system.pl/teamornontowice-zapisy/</code></p>
    <p>Jeśli nic się nie stanie w ciągu kilku sekund, kliknij poniżej. Warto zaktualizować zakładkę.</p>
    <a class="btn" href="https://szkoly-team.takt-system.pl/teamornontowice-zapisy/">Przejdź na nowy adres</a>
  </div>
<script>
  // location.replace, nie assign — stary adres nie zostaje w historii „wstecz".
  // Fragment (#…) przenosimy, żeby linki resetu hasła nadal działały.
  var cel = "https://szkoly-team.takt-system.pl/teamornontowice-zapisy/";
  location.replace(cel + (location.hash || ""));
</script>
</body>
</html>
